<!doctype html><html><head><meta charset="utf-8"><title>Collatz Code</title></head><body><div class="s-page-summary reset s-rte clearfix"><pre>def collatz(number):<br>    if number % 2:<br>        next = number * 3 + 1<br>    else:<br>        next = number // 2<br>    print(next)<br>    return next<br><br>n = int(input())<br>while n != 1:<br>    n = collatz(n)</pre></div></body></html>
